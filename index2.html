<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--muted:#6b7488;--brand:#3b6cf6;--brand2:#e8eefe;--review:#f59e0b;--review2:#fff6e3;--code:#0f172a;--codeink:#e6edf7;--line:#e2e7f1}
@media(prefers-color-scheme:dark){:root{--bg:#0e1320;--card:#161d2e;--ink:#e8ecf5;--muted:#93a0b8;--brand:#6d92ff;--brand2:#1d2a4d;--review:#fbbf24;--review2:#2c2410;--code:#070b14;--codeink:#e6edf7;--line:#263049}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,#3b6cf6,#7a4df0);color:#fff;padding:28px 16px;text-align:center}
header h1{margin:0 0 6px;font-size:1.7rem}
header p{margin:0;opacity:.9}
nav{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
nav a{text-decoration:none;color:var(--brand);background:var(--brand2);border-radius:8px;padding:4px 10px;font-size:.9rem;font-weight:600}
nav a:hover{background:var(--brand);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}
details.level{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:16px 0;overflow:hidden;scroll-margin-top:70px}
details.level>summary{cursor:pointer;padding:16px 18px;font-size:1.25rem;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.level>summary::-webkit-details-marker{display:none}
details.level>summary::after{content:"▾";color:var(--brand);transition:transform .2s}
details.level[open]>summary::after{transform:rotate(180deg)}
.count{font-size:.8rem;font-weight:500;color:var(--muted);margin-inline-start:10px}
.body{padding:0 16px 16px}
.section{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.section h3{margin:0;padding:10px 14px;font-size:1rem;background:var(--brand2);color:var(--brand);display:flex;align-items:center;gap:8px}
.section.review{border-color:var(--review)}
.section.review h3{background:var(--review2);color:var(--review)}
.tag{font-size:.72rem;background:var(--review);color:#fff;border-radius:6px;padding:1px 8px}
.q{padding:10px 14px 14px;border-top:1px solid var(--line)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.qtitle{font-weight:700}
.qtitle span{display:inline-block;background:var(--brand);color:#fff;border-radius:50%;min-width:26px;height:26px;line-height:26px;text-align:center;font-size:.85rem;margin-inline-end:8px}
.copy{border:0;background:var(--brand);color:#fff;border-radius:8px;padding:6px 14px;font-size:.85rem;cursor:pointer;font-family:inherit;transition:background .2s}
.copy:hover{filter:brightness(1.1)}
.copy.done{background:#16a34a}
pre{margin:0;background:var(--code);color:var(--codeink);border-radius:10px;padding:14px;overflow-x:auto;direction:ltr;text-align:left;font-family:Consolas,"Courier New",monospace;font-size:.92rem;line-height:1.55}
footer{text-align:center;color:var(--muted);padding:24px;font-size:.85rem}
</style>
</head>

<script>
(function () {
  var raw = document.getElementById('data').textContent.split('\n');
  var levels = [], L = null, S = null, Q = null;

  raw.forEach(function (line) {
    if (line.indexOf('@L ') === 0) { L = {title: line.slice(3), sections: []}; levels.push(L); S = null; Q = null; }
    else if (line.indexOf('@S ') === 0) { S = {title: line.slice(3), review: false, qs: []}; L.sections.push(S); Q = null; }
    else if (line.indexOf('@R ') === 0) { S = {title: line.slice(3), review: true, qs: []}; L.sections.push(S); Q = null; }
    else if (line.indexOf('@Q ') === 0) { Q = {n: line.slice(3), lines: []}; S.qs.push(Q); }
    else if (Q) { Q.lines.push(line); }
  });

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function copyText(text, btn) {
    function ok() {
      var old = btn.textContent;
      btn.textContent = 'تم النسخ ✓';
      btn.classList.add('done');
      setTimeout(function () { btn.textContent = 'نسخ الكود'; btn.classList.remove('done'); }, 1500);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  var app = document.getElementById('app');
  var nav = document.getElementById('nav');

  levels.forEach(function (lv, i) {
    var total = 0;
    lv.sections.forEach(function (s) { total += s.qs.length; });
    var id = 'level-' + (i + 1);

    var a = el('a', '', String(i + 1));
    a.href = '#' + id;
    a.title = lv.title;
    a.addEventListener('click', function () { document.getElementById(id).open = true; });
    nav.appendChild(a);

    var d = el('details', 'level');
    d.id = id;
    if (i === 0) d.open = true;
    d.appendChild(el('summary', '', '<span>' + lv.title + '<span class="count">' + total + ' كود</span></span>'));

    var body = el('div', 'body');
    lv.sections.forEach(function (s) {
      var sec = el('div', 'section' + (s.review ? ' review' : ''));
      var h = el('h3', '', s.title + (s.review ? ' <span class="tag">مراجعة</span>' : ''));
      sec.appendChild(h);

      s.qs.forEach(function (q) {
        var code = q.lines.join('\n').replace(/\s+$/, '');
        var box = el('div', 'q');
        var head = el('div', 'qhead');
        head.appendChild(el('div', 'qtitle', '<span>' + q.n + '</span>السؤال ' + q.n));
        var btn = el('button', 'copy', 'نسخ الكود');
        btn.type = 'button';
        btn.addEventListener('click', function () { copyText(code, btn); });
        head.appendChild(btn);
        var pre = el('pre');
        pre.textContent = code;
        box.appendChild(head);
        box.appendChild(pre);
        sec.appendChild(box);
      });
      body.appendChild(sec);
    });
    d.appendChild(body);
    app.appendChild(d);
  });

  if (location.hash) {
    var t = document.getElementById(location.hash.slice(1));
    if (t && t.tagName === 'DETAILS') t.open = true;
  }
})();
</script>
